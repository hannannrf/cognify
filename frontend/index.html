<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Study Partner</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1c1c1a; --muted: #5f5f5a; --border: #e2e2dc;
    --accent: #2f5bd3; --accent-text: #ffffff; --error: #b42318; --ok: #1a7f37; --cite-bg: #eef2fd;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1d1b; --text: #ededea; --muted: #a3a39d; --border: #33332f;
      --accent: #7c9cf5; --accent-text: #0d1430; --error: #f97066; --ok: #4ac26b; --cite-bg: #1f2740;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); font-weight: 600; }
  main { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 53px); }
  aside { border-right: 1px solid var(--border); padding: 16px; overflow-y: auto; background: var(--panel); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 20px 0 8px; }
  h2:first-child { margin-top: 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  .course { width: 100%; text-align: left; background: none; border: 1px solid transparent; color: var(--text);
            padding: 8px 10px; border-radius: 6px; cursor: pointer; font: inherit; min-height: 40px; }
  .course:hover { background: var(--bg); }
  .course[aria-current="true"] { border-color: var(--accent); background: var(--cite-bg); }
  .doc { font-size: 14px; color: var(--muted); padding: 4px 0; }
  form.row { display: flex; gap: 8px; }
  input[type=text], textarea { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--bg);
           border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
  button.primary { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 6px;
           padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; min-height: 40px; }
  button:disabled { opacity: .5; cursor: progress; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chat { display: flex; flex-direction: column; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 760px; white-space: pre-wrap; }
  .q { align-self: flex-end; background: var(--accent); color: var(--accent-text); padding: 10px 14px; border-radius: 12px; }
  .a { background: var(--panel); border: 1px solid var(--border); padding: 14px 16px; border-radius: 12px; }
  .a.err { border-color: var(--error); color: var(--error); }
  details { margin-top: 10px; font-size: 14px; white-space: normal; color: var(--text); }
  summary { cursor: pointer; color: var(--muted); }
  .src { background: var(--cite-bg); border-radius: 6px; padding: 8px 10px; margin-top: 6px; }
  .src b { display: block; font-size: 13px; }
  .composer { border-top: 1px solid var(--border); padding: 12px 20px; background: var(--panel); }
  .composer label { font-size: 14px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; margin-top: 8px; }
  .status { font-size: 14px; color: var(--muted); min-height: 21px; margin-top: 6px; }
  .empty { color: var(--muted); margin: auto; text-align: center; }
  .tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; font: inherit; color: var(--muted);
         cursor: pointer; min-height: 44px; }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .panel[hidden] { display: none; }
  .pane { flex: 1; overflow-y: auto; padding: 20px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 16px; max-width: 760px; }
  .toolbar label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .toolbar label.grow { flex: 1; min-width: 180px; }
  select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; min-height: 40px; }
  .qcard { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; max-width: 760px; }
  .qcard fieldset { border: 0; padding: 0; margin: 0; }
  .qcard legend { font-weight: 600; padding: 0; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; margin-top: 8px; cursor: pointer; }
  .opt.right { border-color: var(--ok); box-shadow: inset 3px 0 0 var(--ok); }
  .opt.wrong { border-color: var(--error); box-shadow: inset 3px 0 0 var(--error); }
  .why { font-size: 14px; margin-top: 10px; color: var(--muted); }
  .score { font-size: 20px; font-weight: 600; margin: 0 0 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { text-align: left; min-height: 150px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
          padding: 14px; font: inherit; color: var(--text); cursor: pointer; display: flex; flex-direction: column; }
  .card[aria-pressed="true"] { border-color: var(--accent); background: var(--cite-bg); }
  .card small { margin-top: auto; padding-top: 10px; color: var(--muted); font-size: 12px; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--border); }
    .chat { height: 80vh; }
  }
</style>
</head>
<body>
<header>AI Study Partner</header>
<main>
  <aside>
    <h2>Courses</h2>
    <ul id="courses"></ul>
    <form class="row" id="course-form" style="margin-top:8px">
      <input type="text" id="course-name" placeholder="e.g. OOP" aria-label="New course name" required maxlength="100">
      <button class="primary">Add</button>
    </form>

    <h2>Documents</h2>
    <ul id="docs"><li class="doc">Select a course.</li></ul>
    <form id="upload-form" style="margin-top:8px">
      <input type="file" id="file" accept="application/pdf,.pdf" aria-label="PDF to upload" required>
      <button class="primary" style="margin-top:8px">Upload PDF</button>
    </form>
    <div class="status" id="upload-status" role="status"></div>
  </aside>

  <section class="chat">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" aria-controls="panel-chat" data-panel="panel-chat">Ask</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="panel-quiz" data-panel="panel-quiz">Quiz</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="panel-cards" data-panel="panel-cards">Flashcards</button>
    </div>

    <div class="panel" id="panel-quiz" role="tabpanel" hidden>
      <div class="pane">
        <form class="toolbar" id="quiz-form">
          <label class="grow">Topic (blank = whole course)<input type="text" id="quiz-topic" maxlength="200" placeholder="e.g. virtual functions"></label>
          <label>Difficulty<select id="quiz-difficulty"><option>easy</option><option selected>medium</option><option>hard</option></select></label>
          <label>Questions<select id="quiz-count"><option>3</option><option selected>5</option><option>10</option></select></label>
          <button class="primary">Generate quiz</button>
        </form>
        <div id="quiz" aria-live="polite"><p class="status">Generate a quiz from this course's documents.</p></div>
      </div>
    </div>

    <div class="panel" id="panel-cards" role="tabpanel" hidden>
      <div class="pane">
        <form class="toolbar" id="cards-form">
          <label class="grow">Topic (blank = whole course)<input type="text" id="cards-topic" maxlength="200" placeholder="e.g. inheritance"></label>
          <label>Cards<select id="cards-count"><option>5</option><option selected>8</option><option>15</option></select></label>
          <button class="primary">Generate cards</button>
        </form>
        <div class="status" id="cards-status" role="status"></div>
        <div class="cards" id="cards"></div>
      </div>
    </div>

    <div class="panel" id="panel-chat" role="tabpanel">
    <div id="log" aria-live="polite"><p class="empty">Create a course, upload a lecture PDF, then ask a question.</p></div>
    <form class="composer" id="chat-form">
      <div class="row" style="display:flex;gap:8px">
        <textarea id="question" rows="2" placeholder="Explain polymorphism using my lectures" aria-label="Question" required maxlength="2000"></textarea>
        <button class="primary" id="ask">Ask</button>
      </div>
      <label><input type="checkbox" id="strict" checked> Strict source mode (answer only from my material)</label>
    </form>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let courseId = null;

async function api(path, options = {}) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok && !body.sources) throw new Error(body.detail?.[0]?.msg || body.detail || `HTTP ${res.status}`);
  return body;
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text; // textContent only: model output is never parsed as HTML
  return node;
}

async function loadCourses() {
  const list = $("courses");
  list.replaceChildren();
  for (const c of await api("/api/courses")) {
    const btn = el("button", "course", c.name);
    btn.setAttribute("aria-current", String(c.id === courseId));
    btn.onclick = () => selectCourse(c.id);
    const li = el("li"); li.append(btn); list.append(li);
  }
}

async function selectCourse(id) {
  courseId = id;
  await loadCourses();
  const docs = await api(`/api/courses/${id}/documents`);
  $("docs").replaceChildren(...(docs.length
    ? docs.map((d) => el("li", "doc", `${d.filename} · ${d.page_count} pages`))
    : [el("li", "doc", "No documents yet.")]));
  $("quiz").replaceChildren(el("p", "status", "Generate a quiz from this course's documents."));
  renderCards(await api(`/api/courses/${id}/flashcards`));
}

// ---------- tabs ----------
document.querySelectorAll(".tab").forEach((tab) => (tab.onclick = () => {
  document.querySelectorAll(".tab").forEach((t) => {
    t.setAttribute("aria-selected", String(t === tab));
    $(t.dataset.panel).hidden = t !== tab;
  });
}));

// ---------- quiz ----------
$("quiz-form").onsubmit = async (e) => {
  e.preventDefault();
  if (!courseId) return ($("quiz").textContent = "Select a course first.");
  const btn = e.submitter; btn.disabled = true;
  $("quiz").replaceChildren(el("p", "status", "Writing questions from your material…"));
  try {
    const quiz = await api("/api/quizzes/generate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ course_id: courseId, topic: $("quiz-topic").value,
        difficulty: $("quiz-difficulty").value, count: Number($("quiz-count").value) }),
    });
    renderQuiz(quiz);
  } catch (err) {
    $("quiz").replaceChildren(el("p", "status", `Could not generate quiz: ${err.message}`));
  } finally { btn.disabled = false; }
};

function renderQuiz(quiz) {
  const form = el("form");
  quiz.questions.forEach((q, i) => {
    const card = el("div", "qcard");
    const fs = el("fieldset");
    fs.append(el("legend", null, `${i + 1}. ${q.prompt}`));
    q.options.forEach((opt, j) => {
      const label = el("label", "opt");
      const input = el("input"); input.type = "radio"; input.name = `q${i}`; input.value = j;
      label.append(input, el("span", null, opt));
      fs.append(label);
    });
    card.append(fs); form.append(card);
  });
  const submit = el("button", "primary", "Submit answers");
  form.append(submit);
  form.onsubmit = async (e) => {
    e.preventDefault(); submit.disabled = true;
    const answers = quiz.questions.map((_, i) => {
      const picked = form.querySelector(`input[name=q${i}]:checked`);
      return picked ? Number(picked.value) : null;
    });
    try {
      const r = await api(`/api/quizzes/${quiz.id}/submit`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ answers }),
      });
      form.querySelectorAll("input").forEach((inp) => (inp.disabled = true));
      form.querySelectorAll(".qcard").forEach((card, i) => {
        const res = r.results[i];
        card.querySelectorAll(".opt").forEach((opt, j) => {
          if (j === res.answer_index) opt.classList.add("right");
          else if (j === answers[i]) opt.classList.add("wrong");
        });
        const src = res.source ? ` (${res.source.filename}, page ${res.source.page})` : "";
        card.append(el("p", "why", `${res.correct ? "Correct." : "Not quite."} ${res.explanation}${src}`));
      });
      form.prepend(el("p", "score", `Score: ${r.score} / ${r.total}`));
      submit.remove();
    } catch (err) {
      submit.disabled = false;
      alert(`Could not submit: ${err.message}`);
    }
  };
  $("quiz").replaceChildren(form);
}

// ---------- flashcards ----------
function renderCards(cards) {
  $("cards-status").textContent = cards.length ? `${cards.length} cards. Click a card to flip it.` : "No flashcards yet.";
  $("cards").replaceChildren(...cards.map((c) => {
    const btn = el("button", "card");
    const text = el("span", null, c.front);
    btn.setAttribute("aria-pressed", "false");
    btn.append(text, el("small", null, c.filename ? `${c.filename}, page ${c.page}` : ""));
    btn.onclick = () => {
      const flipped = btn.getAttribute("aria-pressed") !== "true";
      btn.setAttribute("aria-pressed", String(flipped));
      text.textContent = flipped ? c.back : c.front;
    };
    return btn;
  }));
}

$("cards-form").onsubmit = async (e) => {
  e.preventDefault();
  if (!courseId) return ($("cards-status").textContent = "Select a course first.");
  const btn = e.submitter; btn.disabled = true;
  $("cards-status").textContent = "Writing flashcards from your material…";
  try {
    renderCards(await api("/api/flashcards/generate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ course_id: courseId, topic: $("cards-topic").value, count: Number($("cards-count").value) }),
    }));
  } catch (err) {
    $("cards-status").textContent = `Could not generate flashcards: ${err.message}`;
  } finally { btn.disabled = false; }
};

$("course-form").onsubmit = async (e) => {
  e.preventDefault();
  const c = await api("/api/courses", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: $("course-name").value }),
  });
  $("course-name").value = "";
  await selectCourse(c.id);
};

$("upload-form").onsubmit = async (e) => {
  e.preventDefault();
  if (!courseId) return ($("upload-status").textContent = "Select a course first.");
  const btn = e.submitter; btn.disabled = true;
  $("upload-status").textContent = "Reading and indexing… (first upload also downloads the embedding model)";
  try {
    const form = new FormData(); form.append("file", $("file").files[0]);
    const r = await api(`/api/courses/${courseId}/documents`, { method: "POST", body: form });
    $("upload-status").textContent = `Indexed ${r.page_count} pages into ${r.chunks} chunks.`;
    $("file").value = "";
    await selectCourse(courseId);
  } catch (err) {
    $("upload-status").textContent = `Upload failed: ${err.message}`;
  } finally { btn.disabled = false; }
};

function renderAnswer(r) {
  const box = el("div", r.error ? "msg a err" : "msg a", r.error ? `${r.error}\nShowing the matching passages instead.` : r.answer);
  if (r.sources?.length) {
    const det = el("details");
    det.open = !!r.error;
    det.append(el("summary", null, `Sources (${r.sources.length})`));
    r.sources.forEach((s, i) => {
      const src = el("div", "src");
      src.append(el("b", null, `[${i + 1}] ${s.filename}, page ${s.page}`), el("span", null, s.text));
      det.append(src);
    });
    box.append(det);
  }
  return box;
}

$("chat-form").onsubmit = async (e) => {
  e.preventDefault();
  if (!courseId) return alert("Select a course first.");
  const question = $("question").value.trim();
  if (!question) return;
  const log = $("log");
  log.querySelector(".empty")?.remove();
  log.append(el("div", "msg q", question));
  const pending = el("div", "msg a", "Thinking…");
  log.append(pending); log.scrollTop = log.scrollHeight;
  $("question").value = ""; $("ask").disabled = true;
  try {
    const r = await api("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ course_id: courseId, question, strict: $("strict").checked }),
    });
    pending.replaceWith(renderAnswer(r));
  } catch (err) {
    pending.replaceWith(renderAnswer({ error: err.message }));
  } finally { $("ask").disabled = false; log.scrollTop = log.scrollHeight; }
};

$("question").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("chat-form").requestSubmit(); }
});

loadCourses();
</script>
</body>
</html>
