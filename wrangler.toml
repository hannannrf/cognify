# Cloudflare Worker: hosts frontend/ and the AI proxy (worker/index.js). Cloudflare rebuilds it from this file on
# every push to main (repo connected in the dashboard); `npx wrangler@4 deploy` from the repo root does the same.
name = "cognify"
main = "worker/index.js"
compatibility_date = "2025-06-01"

[vars]
# Sites allowed to call the proxy from a browser (exact origins, comma separated).
ALLOWED_ORIGINS = "https://hannannrf.github.io,https://cognify.cognifyai.workers.dev,http://localhost:8001"
DAILY_LIMIT = "20"

# The same Worker also hosts the app; only /api/* reaches the proxy code, everything else is a static file.
[assets]
directory = "frontend"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"] # SQLite-backed Durable Objects are on the Workers free plan
