# Publishes the showcase page (frontend/demo.html) to GitHub Pages. The app itself runs locally.
name: Deploy demo page

on:
  push:
    branches: [main]
    paths: [frontend/demo.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: mkdir _site && cp frontend/demo.html _site/index.html
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
